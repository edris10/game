<!DOCTYPE html>
<html lang="en" dir="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-en="Select Level" data-ku="هەڵبژاردنی ئاست">Select Level</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-image: url(testt.jpg);
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            color: white;
        }

        .con-all {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            margin: 0 0 20px 0;
            text-align: center;
            color: #4CAF50;
        }

        .language-switcher {
            text-align: center;
            margin-bottom: 20px;
        }

        .language-btn {
            background: rgb(0, 0, 0,0.5);
            border: 1px solid #4CAF50;
            color: white;
            padding: 5px 10px;
            margin: 0 5px;
            border-radius: 4px;
            cursor: pointer;
        }

        .language-btn.active {
            background-color: #4CAF50;
        }

        .level-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 15px;
            padding: 20px;
            width: 100%;
            max-width: 800px;
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        #levelButtons {
            display: contents;
        }

        #levelButtons button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 5px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        #levelButtons button:hover {
            background-color: #45a049;
            transform: translateY(-2px);
        }

        #levelButtons button:disabled {
            background-color: #666;
            cursor: not-allowed;
            opacity: 0.7;
        }

        #levelButtons button:disabled:hover {
            background-color: #666;
            transform: none;
        }

        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .menu-button, .reset-btn {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        .reset-btn {
            background-color: #f44336;
        }

        .menu-button:hover {
            background-color: #0056b3;
        }

        .reset-btn:hover {
            background-color: #d32f2f;
        }

        /* RTL styles for Kurdish */
        body[dir="rtl"] {
            direction: rtl;
        }

        body[dir="rtl"] h1 {
            text-align: right;
        }

        @media (max-width: 768px) {
            .level-container {
                grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
                gap: 10px;
                padding: 15px;
            }

            #levelButtons button {
                padding: 10px 5px;
                font-size: 14px;
                min-width: 70px;
            }
        }

        @media (max-width: 480px) {
            .level-container {
                grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
                gap: 8px;
                padding: 10px;
            }

            #levelButtons button {
                padding: 8px 3px;
                font-size: 13px;
                min-width: 60px;
            }

            h1 {
                font-size: 1.5rem;
                margin: 15px 0;
            }

            .menu-button, .reset-btn {
                padding: 10px 15px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="con-all">
        <!-- <div class="language-switcher">
            <button class="language-btn active" onclick="changeLanguage('en')">English</button>
            <button class="language-btn" onclick="changeLanguage('ku')">کوردی</button>
        </div>
         -->
        <h1 data-en="Select a Level" data-ku="ئاستێک هەڵبژێرە">Select a Level</h1>
        
        <div class="level-container" id="levelContainer">
            <div id="levelButtons"></div>
        </div>
        
        <div class="button-container">
            <a href="index.html" class="menu-button" data-en="Back to Main Menu" data-ku="گەڕانەوە بۆ پەڕەی سەرەکی">Back to Main Menu</a>
            <button class="reset-btn" onclick="resetProgress()" data-en="Reset Progress" data-ku="دووبارەکردنەوەی پێشکەوتن">Reset Progress</button>
        </div>
    </div>

    <script src="language.js"></script>
    <script>
        // Initialize language manager
        document.addEventListener('DOMContentLoaded', function() {
            // Set initial language from localStorage
            const savedLang = localStorage.getItem('gameLanguage') || 'en';
            changeLanguage(savedLang);
            
            // Load level buttons
            loadLevelButtons();
            
            // Update active language button
            document.querySelectorAll('.language-btn').forEach(btn => {
                btn.classList.toggle('active', 
                    btn.textContent === (savedLang === 'en' ? 'English' : 'کوردی'));
            });
        });

        function changeLanguage(lang) {
            // Set document direction
            document.body.setAttribute('dir', lang === 'ku' ? 'rtl' : 'ltr');
            
            // Update all translatable elements
            document.querySelectorAll('[data-en], [data-ku]').forEach(element => {
                if (element.dataset[lang]) {
                    element.textContent = element.dataset[lang];
                }
            });
            
            // Save language preference
            localStorage.setItem('gameLanguage', lang);
            
            // Notify other pages if they're open
            if (typeof BroadcastChannel !== 'undefined') {
                const channel = new BroadcastChannel('language_channel');
                channel.postMessage({language: lang});
            }
        }

        function loadLevelButtons() {
            const completedLevel = parseInt(localStorage.getItem('completedLevel')) || 0;
            const totalLevels = 5;
            const container = document.getElementById("levelButtons");
            const lang = localStorage.getItem('gameLanguage') || 'en';

            container.innerHTML = '';

            for (let i = 0; i < totalLevels; i++) {
                const btn = document.createElement("button");
                
                // Set button text based on current language
                if (lang === 'ku') {
                    btn.innerText = `ئاستی ${i + 1}`;
                } else {
                    btn.innerText = `Level ${i + 1}`;
                }
                
                btn.disabled = i > completedLevel;
                btn.style.opacity = btn.disabled ? "0.4" : "1";
                btn.style.cursor = btn.disabled ? "not-allowed" : "pointer";
                
                btn.onclick = () => {
                    window.location.href = `game.html?level=${i}`;
                };
                container.appendChild(btn);
            }
        }

        function resetProgress() {
            const lang = localStorage.getItem('gameLanguage') || 'en';
            const confirmMsg = lang === 'en' 
                ? 'Are you sure you want to reset all progress?' 
                : 'دڵنیایت کە دەتەوێت هەموو پێشکەوتنەکان دووبارە بکەیتەوە؟';
            
            if (confirm(confirmMsg)) {
                localStorage.removeItem('completedLevel');
                
                const alertMsg = lang === 'en'
                    ? 'Progress has been reset.'
                    : 'پێشکەوتنەکان دووبارەکرانەوە.';
                alert(alertMsg);
                
                loadLevelButtons();
            }
        }
    </script>
</body>
</html>
