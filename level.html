<!DOCTYPE html>
<html lang="en" dir="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-en="Select Level" data-ku="هەڵبژاردنی ئاست">Select Level</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-image: url(testt.jpg);
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            color: white;
        }

        .con-all {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            margin: 0 0 20px 0;
            text-align: center;
            color: #4CAF50;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        /* Slideshow Container */
        .slideshow-container {
            width: 100%;
            position: relative;
            margin-bottom: 20px;
        }

        /* Level Slides */
        .level-slide {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .level-slide.active {
            display: block;
        }

        .level-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 15px;
            padding: 20px;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* Level Buttons */
        .level-btn {
            background: linear-gradient(145deg, #4CAF50, #3d8b40);
            color: white;
            border: none;
            padding: 16px 12px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            font-weight: 600;
            position: relative;
            overflow: hidden;
            display: flex
;
        flex-wrap: wrap;
        align-content: center;
        justify-content: center;
        flex-direction: row;
        align-items: center;
        }

        .level-btn:hover:not(:disabled) {
            background: linear-gradient(145deg, #45a049, #367d39);
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.25);
        }

        .level-btn:active:not(:disabled) {
            transform: translateY(1px);
        }

        .level-btn.completed {
            background: linear-gradient(145deg, #2196F3, #1976D2);
        }

        .level-btn.current-level {
            background: linear-gradient(145deg, #FF9800, #FB8C00);
            animation: pulse 1.5s infinite;
        }

        .level-btn:disabled {
            background: linear-gradient(145deg, #555, #333);
            color: #aaa;
            cursor: not-allowed;
        }

        /* Slideshow Navigation */
        .slideshow-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 15px;
        }

        .slide-btn {
            background-color: rgba(76, 175, 80, 0.7);
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            max-width: 120px;
            white-space: nowrap;
        }

        .slide-btn:hover:not(:disabled) {
            background-color: rgba(76, 175, 80, 0.9);
        }

        .slide-btn:disabled {
            background-color: rgba(102, 102, 102, 0.5);
            cursor: not-allowed;
            opacity: 0.7;
        }

        .slide-indicators {
            display: flex;
            justify-content: center;
            gap: 8px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 8px 12px;
            border-radius: 20px;
            margin: 0 10px;
            flex-wrap: wrap;
        }

        .slide-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .slide-indicator.active {
            background-color: #4CAF50;
            transform: scale(1.2);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            width: 100%;
        }

        .menu-button, .reset-btn {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            flex: 1;
            min-width: 160px;
            max-width: 240px;
            text-align: center;
            text-decoration: none;
        }

        .reset-btn {
            background-color: #f44336;
        }

        .menu-button:hover {
            background-color: #0056b3;
        }

        .reset-btn:hover {
            background-color: #d32f2f;
        }

        /* RTL styles */
        body[dir="rtl"] {
            direction: rtl;
        }

        body[dir="rtl"] h1 {
            text-align: right;
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .level-container {
                grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
                gap: 12px;
                padding: 15px;
                display: flex
;
        flex-wrap: wrap;
        align-content: center;
        justify-content: center;
        flex-direction: row;
        align-items: center;
            }

            .level-btn {
                padding: 14px 10px;
                font-size: 14px;
                min-width: 80px;
            }

            .slide-btn {
                padding: 8px 12px;
                font-size: 14px;
            }
        }

        @media (max-width: 576px) {
            .level-container {
                grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
                gap: 10px;
                padding: 12px;
                display: flex
;
        flex-wrap: wrap;
        align-content: center;
        justify-content: center;
        flex-direction: row;
        align-items: center;
            }

            .level-btn {
                padding: 12px 8px;
                font-size: 13px;
                min-width: 70px;
            }

            .slideshow-nav {
                flex-direction: column;
                gap: 10px;
            }

            .slide-indicators {
                order: -1;
                width: auto;
                margin: 0 0 10px 0;
            }

            .slide-btn {
                max-width: 100%;
            }

            h1 {
                font-size: 1.5rem;
            }

            .menu-button, .reset-btn {
                min-width: 120px;
                padding: 10px 15px;
                font-size: 14px;
            }
        }

        @media (max-width: 400px) {
            .level-container {
                grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
                gap: 8px;
                padding: 10px;
                display: flex
;
        flex-wrap: wrap;
        align-content: center;
        justify-content: center;
        flex-direction: row;
        align-items: center;

            }

            .level-btn {
                padding: 10px 6px;
                font-size: 12px;
                min-width: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="con-all">
        <h1 data-en="Select a Level" data-ku="ئاستێک هەڵبژێرە">Select a Level</h1>
        
        <div class="slideshow-container" id="slideshow">
            <!-- Slides will be inserted here by JavaScript -->
        </div>
        
        <div class="slideshow-nav">
            <button class="slide-btn" id="prevBtn" data-en="Previous" data-ku="پێشوو">Previous</button>
            <div class="slide-indicators" id="indicators"></div>
            <button class="slide-btn" id="nextBtn" data-en="Next" data-ku="دواتر">Next</button>
        </div>
        
        <div class="button-container">
            <a href="index.html" class="menu-button" data-en="Back to Main Menu" data-ku="گەڕانەوە بۆ پەڕەی سەرەکی">Back to Main Menu</a>
            <button class="reset-btn" onclick="resetProgress()" data-en="Reset Progress" data-ku="دووبارەکردنەوەی پێشکەوتن">Reset Progress</button>
        </div>
    </div>

    <script>
        // Configuration
        const LEVELS_PER_SLIDE = 5;
        const TOTAL_LEVELS = 10;
        let currentSlide = 0;
        let totalSlides = 0;

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            // Set initial language from localStorage
            const savedLang = localStorage.getItem('gameLanguage') || 'en';
            changeLanguage(savedLang);
            
            // Initialize slideshow
            initSlideshow();
        });

        function changeLanguage(lang) {
            // Set document direction
            document.body.setAttribute('dir', lang === 'ku' ? 'rtl' : 'ltr');
            
            // Update all translatable elements
            document.querySelectorAll('[data-en], [data-ku]').forEach(element => {
                if (element.dataset[lang]) {
                    element.textContent = element.dataset[lang];
                }
            });
            
            // Save language preference
            localStorage.setItem('gameLanguage', lang);
        }

        function initSlideshow() {
            const completedLevel = parseInt(localStorage.getItem('completedLevel')) || 0;
            const lang = localStorage.getItem('gameLanguage') || 'en';
            
            // Calculate total slides needed
            totalSlides = Math.ceil(TOTAL_LEVELS / LEVELS_PER_SLIDE);
            const slideshow = document.getElementById('slideshow');
            const indicators = document.getElementById('indicators');
            
            // Clear existing content
            slideshow.innerHTML = '';
            indicators.innerHTML = '';
            
            // Create slides and indicators
            for (let slideIndex = 0; slideIndex < totalSlides; slideIndex++) {
                // Create slide container
                const slide = document.createElement('div');
                slide.className = 'level-slide';
                if (slideIndex === 0) slide.classList.add('active');
                
                // Create level container
                const levelContainer = document.createElement('div');
                levelContainer.className = 'level-container';
                
                // Add levels to this slide (10 levels per slide)
                const startLevel = slideIndex * LEVELS_PER_SLIDE;
                const endLevel = Math.min(startLevel + LEVELS_PER_SLIDE, TOTAL_LEVELS);
                
                for (let i = startLevel; i < endLevel; i++) {
                    const btn = document.createElement('button');
                    btn.className = 'level-btn';
                    
                    // Set button text based on current language
                    if (lang === 'ku') {
                        btn.innerText = `ئاستی ${i + 1}`;
                    } else {
                        btn.innerText = `Level ${i + 1}`;
                    }
                    
                    // Set button state
                    if (i < completedLevel) {
                        btn.classList.add('completed');
                    } else if (i === completedLevel) {
                        btn.classList.add('current-level');
                    } else {
                        btn.disabled = true;
                    }
                    
                    btn.onclick = () => {
                        window.location.href = `game.html?level=${i}`;
                    };
                    
                    levelContainer.appendChild(btn);
                }
                
                slide.appendChild(levelContainer);
                slideshow.appendChild(slide);
                
                // Create indicator
                const indicator = document.createElement('div');
                indicator.className = 'slide-indicator';
                if (slideIndex === 0) indicator.classList.add('active');
                indicator.onclick = () => goToSlide(slideIndex);
                indicators.appendChild(indicator);
            }
            
            // Set up navigation buttons
            document.getElementById('prevBtn').onclick = () => navigate(-1);
            document.getElementById('nextBtn').onclick = () => navigate(1);
            
            // Update navigation buttons
            updateNavButtons();
        }

        function navigate(direction) {
            const newSlide = currentSlide + direction;
            if (newSlide >= 0 && newSlide < totalSlides) {
                goToSlide(newSlide);
            }
        }

        function goToSlide(slideIndex) {
            if (slideIndex < 0 || slideIndex >= totalSlides) return;
            
            // Hide current slide
            document.querySelectorAll('.level-slide')[currentSlide].classList.remove('active');
            document.querySelectorAll('.slide-indicator')[currentSlide].classList.remove('active');
            
            // Show new slide
            document.querySelectorAll('.level-slide')[slideIndex].classList.add('active');
            document.querySelectorAll('.slide-indicator')[slideIndex].classList.add('active');
            
            currentSlide = slideIndex;
            updateNavButtons();
        }

        function updateNavButtons() {
            document.getElementById('prevBtn').disabled = currentSlide === 0;
            document.getElementById('nextBtn').disabled = currentSlide === totalSlides - 1;
        }

        function resetProgress() {
            const lang = localStorage.getItem('gameLanguage') || 'en';
            const confirmMsg = lang === 'en' 
                ? 'Are you sure you want to reset all progress?' 
                : 'دڵنیایت کە دەتەوێت هەموو پێشکەوتنەکان دووبارە بکەیتەوە؟';
            
            if (confirm(confirmMsg)) {
                localStorage.removeItem('completedLevel');
                
                const alertMsg = lang === 'en'
                    ? 'Progress has been reset.'
                    : 'پێشکەوتنەکان دووبارەکرانەوە.';
                alert(alertMsg);
                
                initSlideshow();
            }
        }
    </script>
</body>
</html>
