<!DOCTYPE html>
<html lang="en" dir="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-en="Block Game" data-ku="یاری بلۆک">Block Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            scroll-behavior: smooth;
            background: #131313;
            font-family:'Helvetica Neue', sans-serif;
        }

        h1 a {
            font-size: 80px;
            color: #BF2E97;
            text-decoration: none;
            text-transform: uppercase;
        }

        .popover {
            display: none;
            box-shadow: 0px 6px 8px rgba(19, 19, 19, .7);
        }

        .popover:target {
            position: absolute;
            right: 0;
            top: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .popover .content {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 0;
            height: 0;
            color: #fff;
            background-color: #191919;
            animation: 1s grow ease forwards;
            text-align: center;
        }

        .nav_list {
            list-style-type: none;
        }

        .nav_list a {
            text-decoration: none;
            font-size: 50px;
            color: #fff;
        }

        .nav_list_item {
            height: 100%;
            overflow: hidden;
        }

        .nav_list li {
            padding: 15px 0;
            text-transform: uppercase;
            transform: translateY(200px);
            opacity: 0;
            animation: 2s slideUp ease forwards .5s;
            position: relative;
        }

        .nav_list li::before {
            content: '';
            position: absolute;
            height: 2px;
            width: 0px;
            left: 0;
            bottom: 10px;
            background: #BF2E97; 
            transition: all .5s ease;
        }

        .nav_list li:hover:before {
            width: 100%;
        }

        .popover p {
            padding: 50px;
            opacity: 0;
            animation: 1s fadeIn ease forwards 1s;
        }

        .popover .close::after {
            right: 0;
            top: 0;
            width: 50px;
            height: 50px;
            position: absolute;
            display: flex;
            z-index: 1;
            font-size: 30px;
            align-items: center;
            justify-content: center;
            background-color: #BF2E97;
            color: #fff;
            content: "×";
            cursor: pointer;
            opacity: 0; 
            animation: 1s fadeIn ease forwards .5s;
        }

        /* Language Switcher */
        .language-switcher {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1001;
        }

        .lang-btn {
            background: rgba(191, 46, 151, 0.3);
            border: 1px solid #BF2E97;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .lang-btn.active {
            background: #BF2E97;
            font-weight: bold;
        }

        /* RTL Support */
        body[dir="rtl"] {
            direction: rtl;
        }
        
        body[dir="rtl"] .language-switcher {
            right: auto;
            left: 20px;
        }
        
        body[dir="rtl"] .nav_list li::before {
            left: auto;
            right: 0;
        }

        @keyframes grow {
            100% {
                height: 90%;
                width: 90%;
            }
        }

        @keyframes fadeIn {
            100% {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <!-- Language Switcher -->
    <div class="language-switcher">
        <button class="lang-btn active" data-lang="en">English</button>
        <button class="lang-btn" data-lang="ku">کوردی</button>
    </div>

    <div class="container">
        <h1>
            <a href="#menu" data-en="Block Game" data-ku="یاری بلۆک">Block Game</a>
        </h1>
            
        <div class="popover" id="menu">
            <div class="content">
                <a href="#" class="close"></a>
                <div class="nav">
                    <ul class="nav_list">
                        <div class="nav_list_item">
                            <li><a href="game.html" data-en="Game" data-ku="یاری">Game</a></li>
                        </div>
                        <div class="nav_list_item">
                            <li><a href="level.html" data-en="Levels" data-ku="ئاستەکان">Levels</a></li>
                        </div>
                        <div class="nav_list_item">
                            <li><a href="pro.html" data-en="Products" data-ku="بەرهەمەکان">Products</a></li>
                        </div>
                        <div class="nav_list_item">
                            <li><a href="settings.html" data-en="Settings" data-ku="ڕێکخستنەکان">Settings</a></li>
                        </div>
                        <div class="nav_list_item">
                            <li><a href="AboutMe.html" data-en="About" data-ku="دەربارە">About</a></li>
                        </div>
                    </ul>
                </div>
            </div>
        </div>
    </div>

     <script src="language.js"></script>
    <script>
        // Language management
        let currentLanguage = localStorage.getItem('gameLanguage') || 'en';
        
        // Initialize language on load
        document.addEventListener('DOMContentLoaded', function() {
            setLanguage(currentLanguage);
            
            // Set up language button clicks
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const lang = this.getAttribute('data-lang');
                    setLanguage(lang);
                });
            });
        });
        
        function setLanguage(lang) {
            currentLanguage = lang;
            localStorage.setItem('gameLanguage', lang);
            
            // Set document direction
            document.body.setAttribute('dir', lang === 'ku' ? 'rtl' : 'ltr');
            
            // Update active language button
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
            });
            
            // Update all translatable text
            document.querySelectorAll('[data-en], [data-ku]').forEach(element => {
                if (element.dataset[lang]) {
                    element.textContent = element.dataset[lang];
                }
            });
        }
    </script>
</body>
</html>
